# Supabase CLI project config. `supabase start` reads this for local dev.
project_id = "wedplan"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[storage]
# The moodboards bucket (spec 9). Created by scripts/ensure-bucket.mjs, never
# by a migration — see that file's header for why.
enabled = true
file_size_limit = "20MiB"

[studio]
enabled = true
port = 54323

[inbucket]          # catches outbound mail locally so nothing reaches a guest
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = false          # two users, both invited by hand

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
