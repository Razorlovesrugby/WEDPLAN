name: verify

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner ships PostgreSQL but does not start it; verify-migrations.sh
      # builds its own throwaway cluster, so no service container is needed.
      - name: Apply migrations and run the SQL suite
        run: ./scripts/verify-migrations.sh

      - name: Verify the bootstrap script on a clean database
        run: ./scripts/verify-bootstrap.sh

      # The nightly backup's dump and restore scripts, run end to end against
      # a throwaway cluster, so a migration that breaks them fails here and
      # not on the night a restore is needed (spec 32 §3.3).
      - name: Verify a backup restores
        run: ./scripts/verify-restore.sh

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
